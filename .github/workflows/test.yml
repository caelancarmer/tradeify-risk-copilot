---
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 tests/test_rule_engine.py
      - run: python3 tests/test_payout.py
      - run: python3 tests/test_dashboard.py
      - run: python3 tests/test_rule_registry.py
      - run: python3 tests/test_precheck.py
      - run: python3 tests/test_explainer.py
      - run: python3 tests/test_microscalping.py
      - run: python3 tests/test_buffer_alerts.py
      - run: python3 tests/test_ops_panels.py
      - run: python3 scripts/run_payout_eval.py
      - run: python3 scripts/run_precheck_eval.py
      - run: python3 scripts/run_buffer_eval.py
      - run: python3 src/rule_registry.py
