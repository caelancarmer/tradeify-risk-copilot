# Alembic configuration for Tradeify Risk Copilot payout tables.
# Minimal on purpose: the DB URL is read from POSTGRES_URL in env.py so no
# credentials are ever committed here.
#
# Usage:
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left blank; env.py resolves POSTGRES_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s